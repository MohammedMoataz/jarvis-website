# Checks every pull request. The build uses the release fixture, so it needs no secrets.
name: CI
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      JARVIS_RELEASE_FIXTURE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run themes
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
