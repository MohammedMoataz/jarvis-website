# Production deploy through the Vercel CLI (the ai-coach-website pattern). Runs on push to main,
# by hand, and when JARVIS sends `jarvis-released` (its notify-site workflow, on a published
# release) or `jarvis-tunnel` (scripts/publish-tunnel.mjs, after the quick tunnel starts).
# Needs secrets VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID (from `vercel link`) and
# JARVIS_RELEASES_TOKEN (read-only Contents on the private JARVIS repo); until all four exist it
# skips instead of failing. The server address comes from the repository variable JARVIS_SERVER_URL.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [jarvis-released, jarvis-tunnel]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
          ORG: ${{ secrets.VERCEL_ORG_ID }}
          PROJECT: ${{ secrets.VERCEL_PROJECT_ID }}
          RELEASES: ${{ secrets.JARVIS_RELEASES_TOKEN }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG" ] && [ -n "$PROJECT" ] && [ -n "$RELEASES" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "Secrets incomplete (need VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID, JARVIS_RELEASES_TOKEN); skipping deploy." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      JARVIS_RELEASES_TOKEN: ${{ secrets.JARVIS_RELEASES_TOKEN }}
      JARVIS_SERVER_URL: ${{ vars.JARVIS_SERVER_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # `vercel build` runs only `next build`; production must also pass what CI checks.
      - run: npm ci
      - run: npm run themes
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm i -g vercel@65.5.0
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
